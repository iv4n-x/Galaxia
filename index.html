<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>💗 Un universo para ti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💗%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#04060f; --pink:#ff8fb8; --pink-soft:#ffc9de; --pink-hot:#ff5f9e;
    --glass:rgba(12,16,30,.58); --line:rgba(255,150,195,.28);
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Quicksand','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;background:#04060f;color:#ffe3ef;font-family:var(--sans);
    user-select:none;-webkit-user-select:none;
    background-image:
      radial-gradient(1px 1px at 18% 22%,rgba(255,255,255,.35),transparent),
      radial-gradient(1px 1px at 72% 14%,rgba(255,200,225,.3),transparent),
      radial-gradient(1.5px 1.5px at 84% 64%,rgba(255,255,255,.25),transparent),
      radial-gradient(1px 1px at 32% 78%,rgba(255,255,255,.3),transparent),
      radial-gradient(1px 1px at 56% 42%,rgba(255,200,225,.25),transparent),
      radial-gradient(1.5px 1.5px at 8% 58%,rgba(255,255,255,.2),transparent);
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 52%,rgba(2,4,10,.55) 100%)}
  #flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;transition:opacity .6s ease;
    background:radial-gradient(circle at 50% 50%,rgba(255,240,247,.98),rgba(255,150,200,.55) 38%,transparent 72%)}
  #flash.on{opacity:1;transition:opacity .1s ease}

  /* ── botón de sonido ─────────────────────────── */
  #muteBtn{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    z-index:50;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:20px;line-height:1;color:#ffd7e8;cursor:pointer;touch-action:manipulation;
    box-shadow:0 0 18px rgba(255,120,170,.15);transition:transform .2s ease,box-shadow .2s ease;
  }
  #muteBtn:hover{transform:scale(1.09);box-shadow:0 0 26px rgba(255,120,170,.35)}
  #muteBtn:active{transform:scale(.93)}
  #muteBtn.muted{opacity:.75}

  /* ── tarjeta de entrada ──────────────────────── */
  #entry{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
    background:radial-gradient(ellipse at 50% 45%,rgba(8,12,26,.2),rgba(3,5,12,.8));
    transition:opacity .9s ease}
  #entry.gone{opacity:0;pointer-events:none}
  #entryCard{
    text-align:center;cursor:pointer;max-width:min(88vw,470px);
    padding:clamp(30px,6vw,50px) clamp(28px,7vw,62px);border-radius:26px;
    background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 90px rgba(0,0,0,.55),0 0 44px rgba(255,120,175,.14),inset 0 0 30px rgba(255,150,195,.05);
    animation:cardFloat 6s ease-in-out infinite;transition:translate .3s ease,box-shadow .3s ease;
  }
  #entryCard:hover,#entryCard:focus-visible{translate:0 -4px;
    box-shadow:0 30px 100px rgba(0,0,0,.6),0 0 60px rgba(255,120,175,.28);outline:none}
  #entryCard .orn{color:var(--pink);letter-spacing:14px;font-size:13px;opacity:.85;margin-bottom:14px;text-indent:14px}
  #entryCard h1{font-family:var(--serif);font-style:italic;font-weight:600;
    font-size:clamp(27px,5.6vw,40px);color:#ffd9e9;letter-spacing:.5px;line-height:1.15}
  #entryCard .sub{margin-top:10px;font-size:clamp(12px,3vw,14px);color:rgba(205,214,238,.72);letter-spacing:.4px}
  #entryCard .cta{
    display:inline-block;margin-top:26px;padding:13px 30px;border-radius:999px;
    border:1px solid rgba(255,140,185,.5);background:rgba(255,120,170,.13);
    color:#ffc2d9;font-weight:600;font-size:clamp(15px,3.8vw,18px);letter-spacing:.6px;
    box-shadow:0 0 24px rgba(255,120,170,.22);animation:ctaPulse 2.3s ease-in-out infinite;
  }
  #entryCard .tiny{margin-top:18px;font-size:11.5px;color:rgba(200,210,235,.5);letter-spacing:1.5px}
  @keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes ctaPulse{0%,100%{box-shadow:0 0 18px rgba(255,120,170,.18)}50%{box-shadow:0 0 40px rgba(255,120,170,.5)}}

  /* ── pista de controles ──────────────────────── */
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:30;pointer-events:none;max-width:92vw;text-align:center;
    padding:9px 18px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,150,195,.16);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:12px;letter-spacing:.4px;color:rgba(207,214,238,.9);
    opacity:0;transition:opacity 1.1s ease}
  #hint.show{opacity:.9}

  /* ── mensaje al tocar personajes ─────────────── */
  #toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px) scale(.95);z-index:45;pointer-events:none;
    max-width:min(88vw,460px);text-align:center;padding:14px 22px;border-radius:18px;
    background:var(--glass);border:1px solid rgba(255,150,195,.35);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 12px 50px rgba(0,0,0,.5),0 0 30px rgba(255,120,175,.15);
    opacity:0;transition:opacity .4s ease,transform .45s cubic-bezier(.2,.9,.3,1.25)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  #toastWho{display:block;font-size:10.5px;font-weight:600;letter-spacing:2.5px;color:var(--pink);margin-bottom:5px}
  #toastMsg{font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.45;color:#ffe6f0}

  /* ── cartas de amor ──────────────────────────── */
  #letterWrap{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:18px;
    background:rgba(3,5,12,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;transition:opacity .35s ease}
  #letterWrap.show{opacity:1}
  #letterWrap[hidden]{display:none}
  #letterCard{position:relative;width:min(92vw,540px);max-height:82vh;overflow-y:auto;
    padding:32px 30px 26px;border-radius:22px;
    background:linear-gradient(160deg,#171126,#0c0a18 55%,#180d1e);
    border:1px solid rgba(255,150,195,.32);
    box-shadow:0 24px 90px rgba(0,0,0,.65),0 0 46px rgba(255,120,175,.14);
    transform:translateY(0);transition:transform .3s ease}
  #letterCard.pop{animation:letterPop .4s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes letterPop{0%{transform:scale(.96)}100%{transform:scale(1)}}
  #letterCard .lhead{font-size:10.5px;font-weight:600;letter-spacing:3px;color:var(--pink);margin-bottom:10px}
  #letterTitle{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;color:#ffd9e9;margin-bottom:12px}
  #letterBody{font-family:var(--serif);font-size:17.5px;line-height:1.75;color:#f2e6ee;user-select:text;-webkit-user-select:text}
  #letterBody p{margin:.75em 0}
  #letterCard .lsig{margin-top:16px;text-align:right;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--pink-soft)}
  #letterNext{display:block;margin:22px auto 0;padding:11px 26px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,140,185,.45);background:rgba(255,120,170,.12);color:#ffc2d9;
    font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.5px;touch-action:manipulation;
    transition:transform .2s ease,box-shadow .2s ease}
  #letterNext:hover{transform:scale(1.05);box-shadow:0 0 26px rgba(255,120,170,.35)}
  #letterClose{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(255,150,195,.25);background:rgba(255,255,255,.05);color:#ffc9de;font-size:15px;
    transition:transform .2s ease}
  #letterClose:hover{transform:scale(1.12)}
  button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

  /* ── corazones que estallan al tocar ─────────── */
  #burstLayer{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
  .bheart{position:fixed;pointer-events:none;color:#ff8fb8;text-shadow:0 0 10px rgba(255,120,170,.9);
    animation:bfly 1.15s ease-out forwards;will-change:transform,opacity}
  @keyframes bfly{
    0%{transform:translate(-50%,-50%) scale(.5) rotate(0deg);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--rot));opacity:0}
  }
  @media (max-width:600px){
    #toast{bottom:calc(64px + env(safe-area-inset-bottom));padding:12px 18px}
    #toastMsg{font-size:16px}
    #hint{font-size:11px;padding:8px 14px}
    #letterCard{padding:26px 22px 22px}
    #letterBody{font-size:16.5px}
  }
  @media (prefers-reduced-motion:reduce){
    #entryCard,#entryCard .cta{animation:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<button id="muteBtn" aria-label="Silenciar todo">🔊</button>
<div id="hint">Arrastra para orbitar · rueda o pellizca para acercar · toca a Kitty y al corazón 💗</div>
<div id="toast" aria-live="polite"><span id="toastWho"></span><span id="toastMsg"></span></div>

<div id="letterWrap" hidden>
  <div id="letterCard" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <button id="letterClose" aria-label="Cerrar carta">✕</button>
    <div class="lhead">💌 CARTA DE AMOR</div>
    <h2 id="letterTitle"></h2>
    <div id="letterBody"></div>
    <div class="lsig">— con todo mi corazón ♥</div>
    <button id="letterNext">Otra carta 💌</button>
  </div>
</div>

<div id="entry">
  <div id="entryCard" role="button" tabindex="0" aria-label="Toca para entrar al universo">
    <div class="orn">✦ ✧ ✦</div>
    <h1>Un universo para ti</h1>
    <p class="sub">estrellas, latidos y un par de héroes enamorados</p>
    <div class="cta">💗 Toca para entrar</div>
    <p class="tiny">🎧 PONTE LOS AUDÍFONOS</p>
  </div>
</div>

<div id="burstLayer"></div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#ffc9de;font-family:serif">Activa JavaScript para entrar a este universo 💗</div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ════════════════════════════════════════════════════════════════
   ✏️ EDITA AQUÍ: frases flotantes, mensajes de personajes y cartas
   ════════════════════════════════════════════════════════════════ */
const PHRASES=[
  'Te amo ∞','Eres mi universo','Contigo, siempre',
  'Mi estrella favorita','Amor a años luz','Tú + Yo = ∞',
  'Cada latido: tú','Mi gravedad eres tú','Destino: tú',
  'Amor eterno ✦','Mi corazón es tuyo'
];
const MSGS=[
  'Eres mi casualidad favorita en todo el universo.',
  'Mi moño y yo tenemos claro que eres el amor de mi vida.',
  'Contigo, hasta la galaxia más lejana queda cerca.',
  'Si el multiverso existe, en todos te vuelvo a elegir.',
  'Tu sonrisa tiene más brillo que todas estas estrellas.',
  'Puedo flotar entre galaxias, pero siempre vuelvo a ti.',
  'Mi lugar favorito del cosmos es a tu lado.',
  'Eres mi mejor sorpresa y mi única responsabilidad.',
  'Cada órbita de mi corazón termina en ti.',
  'Ni todas las estrellas juntas brillan como tú para mí.',
  'Te amo más allá del último borde del universo.',
  'Contigo no necesito moño: ya estoy atrapado en tu amor.'
];
const LETTERS=[
  {title:'A través de las estrellas',body:[
    'Si alguna vez te preguntas cuánto te amo, mira este cielo: cada estrella es un pensamiento tuyo que no me deja dormir, y cada órbita es una vuelta más de mi corazón alrededor del tuyo.',
    'No sé en qué momento te convertiste en mi centro de gravedad; solo sé que desde entonces todo lo demás gira en segundo plano. La galaxia entera puede esperar cuando tú sonríes.',
    'Y si un día se apagan todas las luces del universo, quédate tranquila: yo seguiré brillando por ti, aunque sea con el último latido.'
  ]},
  {title:'Mi gravedad',body:[
    'Dicen que los agujeros negros lo atraen todo y no dejan escapar nada. Yo creía que eso era física, hasta que te conocí: me atrajiste sin tocarme, y ya no quiero escapar.',
    'Te amo en las mañanas fáciles y en las noches difíciles; te amo cuando el día pesa y cuando el mundo canta. Eres mi constante en un universo que no deja de expandirse.',
    'Si el amor se mide en años luz, el mío por ti ya salió de esta galaxia hace mucho… y sigue viajando.'
  ]},
  {title:'Para siempre, en órbita',body:[
    'No te prometo la luna: está muy lejos y además no brilla como tú. Te prometo algo mejor: quedarme. En cada vuelta, en cada eclipse, en cada tormenta solar.',
    'Que pasen mil galaxias, que se apaguen mil soles: mi corazón seguirá latiendo tu nombre con este mismo ritmo, terco y enamorado.',
    'Gracias por existir en mi universo. De todas las casualidades del cosmos, tú eres mi favorita. Te amo, hoy y en todas las vidas que vengan.'
  ]}
];
/* ═══════════════════ utilidades ═══════════════════ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const clamp01=v=>clamp(v,0,1);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const smooth=p=>{p=clamp01(p);return p*p*(3-2*p);};
const easeOutCubic=p=>1-Math.pow(1-clamp01(p),3);
const easeOutBack=p=>{p=clamp01(p);const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const IS_MOBILE=matchMedia('(pointer: coarse)').matches||Math.min(innerWidth,innerHeight)<640;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR=Math.min(devicePixelRatio||1,IS_MOBILE?1.8:2);
const WARP_DUR=REDUCED?1.1:3.2;
const SERIF="'Cormorant Garamond', Georgia, 'Times New Roman', serif";
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
/* ritmo de latido real: lub-dub */
function heartbeat(t){const ph=(t%1.15)/1.15;
  return Math.exp(-Math.pow((ph-0.10)/0.045,2))+0.55*Math.exp(-Math.pow((ph-0.30)/0.055,2));}
/* corazón paramétrico relleno (mismo para 3D, 2D y burbujas) */
function heartPoints(n){
  const pts=[];let guard=0;
  while(pts.length<n&&guard<n*60){guard++;
    const t=rand(0,Math.PI*2);
    const bx=16*Math.pow(Math.sin(t),3);
    const by=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const k=Math.sqrt(Math.random());
    pts.push({x:(bx*k)/16,y:(1.5+(by-1.5)*k)/16,edge:k>0.92});
  }
  for(let j=0;j<130;j++){const t=j/130*Math.PI*2;
    pts.push({x:Math.pow(Math.sin(t),3),
      y:(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16,edge:true});}
  return pts;
}
function heartPath(g,cx,cy,s){
  g.beginPath();
  for(let k=0;k<=40;k++){const t=k/40*Math.PI*2;
    const x=cx+s*Math.pow(Math.sin(t),3);
    const y=cy-s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16+s*0.1;
    k===0?g.moveTo(x,y):g.lineTo(x,y);}
  g.closePath();
}
/* ═══════════ personajes dibujados (fallback de stickers) ═══════════ */
function drawKitty(blink){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const earL=[[62,108],[70,48],[118,78]],earR=[[194,108],[186,48],[138,78]];
  function tri(p){g.beginPath();g.moveTo(p[0][0],p[0][1]);g.lineTo(p[1][0],p[1][1]);g.lineTo(p[2][0],p[2][1]);g.closePath();}
  /* borde blanco tipo sticker */
  g.lineWidth=17;g.strokeStyle='#fff';g.fillStyle='#fff';g.lineJoin='round';
  tri(earL);g.fill();g.stroke();tri(earR);g.fill();g.stroke();
  g.beginPath();g.ellipse(128,138,76,62,0,0,Math.PI*2);g.fill();g.stroke();
  /* orejas + cabeza */
  g.lineWidth=5;g.strokeStyle='#2a2230';
  tri(earL);g.fillStyle='#fff';g.fill();g.stroke();
  tri(earR);g.fill();g.stroke();
  g.beginPath();g.ellipse(128,138,76,62,0,0,Math.PI*2);g.fillStyle='#fff';g.fill();g.stroke();
  /* moño */
  g.fillStyle='#ff5f8f';g.strokeStyle='#d13c6f';g.lineWidth=4;
  g.save();g.translate(170,52);g.rotate(-0.5);g.beginPath();g.ellipse(0,0,19,13,0,0,Math.PI*2);g.fill();g.stroke();g.restore();
  g.save();g.translate(203,55);g.rotate(0.5);g.beginPath();g.ellipse(0,0,19,13,0,0,Math.PI*2);g.fill();g.stroke();g.restore();
  g.beginPath();g.arc(186,57,9,0,Math.PI*2);g.fill();g.stroke();
  /* ojos (parpadeo animado) */
  g.strokeStyle='#241f2b';g.fillStyle='#241f2b';g.lineWidth=5;g.lineCap='round';
  if(blink){
    g.beginPath();g.moveTo(90,158);g.quadraticCurveTo(98,166,106,158);g.stroke();
    g.beginPath();g.moveTo(150,158);g.quadraticCurveTo(158,166,166,158);g.stroke();
  }else{
    g.beginPath();g.ellipse(98,156,7,10,0,0,Math.PI*2);g.fill();
    g.beginPath();g.ellipse(158,156,7,10,0,0,Math.PI*2);g.fill();
  }
  /* nariz */
  g.fillStyle='#ffd23e';g.strokeStyle='#e0a92f';g.lineWidth=3;
  g.beginPath();g.ellipse(128,172,8,6,0,0,Math.PI*2);g.fill();g.stroke();
  /* bigotes */
  g.strokeStyle='#241f2b';g.lineWidth=4;
  [[46,120,12,112],[46,136,10,136],[46,152,14,160],
   [210,120,244,112],[210,136,246,136],[210,152,242,160]].forEach(w=>{
    g.beginPath();g.moveTo(w[0],w[1]);g.lineTo(w[2],w[3]);g.stroke();});
  /* mejillas */
  g.fillStyle='rgba(255,140,180,.35)';
  g.beginPath();g.arc(80,178,10,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(176,178,10,0,Math.PI*2);g.fill();
  return c;
}
function drawSpidey(squint){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  /* hilo de telaraña */
  g.strokeStyle='rgba(230,240,255,.85)';g.lineWidth=3;g.lineCap='round';
  g.beginPath();g.moveTo(128,0);g.lineTo(128,66);g.stroke();
  g.lineWidth=2;g.beginPath();g.moveTo(120,26);g.lineTo(136,26);g.stroke();
  /* borde sticker + máscara */
  g.fillStyle='#fff';g.beginPath();g.ellipse(128,150,79,89,0,0,Math.PI*2);g.fill();
  g.fillStyle='#e23636';g.strokeStyle='#5f0d18';g.lineWidth=5;
  g.beginPath();g.ellipse(128,150,72,82,0,0,Math.PI*2);g.fill();g.stroke();
  /* red de la máscara */
  g.save();
  g.beginPath();g.ellipse(128,150,70,80,0,0,Math.PI*2);g.clip();
  g.strokeStyle='rgba(70,10,18,.8)';g.lineWidth=2.5;
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
    g.beginPath();g.moveTo(128,142);g.lineTo(128+Math.cos(a)*100,142+Math.sin(a)*100);g.stroke();}
  [20,38,56,74,92].forEach(r=>{g.beginPath();g.arc(128,142,r,0,Math.PI*2);g.stroke();});
  g.restore();
  /* ojos grandes (con guiño animado) */
  function eye(){
    g.beginPath();

function ensureAudio(){
  if(actx)return;

function whoosh(){
  if(!actx||muted)return;
  const t0=actx.currentTime,dur=WARP_DUR;
  const len=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource();src.buffer=buf;
  const bp=actx.createBiquadFilter();bp.type='bandpass';bp.Q.value=0.9;
  bp.frequency.setValueAtTime(160,t0);
  bp.frequency.exponentialRampToValueAtTime(1500,t0+dur*0.7);
  bp.frequency.exponentialRampToValueAtTime(300,t0+dur);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.5,t0+dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(bp);bp.connect(g);g.connect(master);
  src.start(t0);src.stop(t0+dur+0.05);
}
function chime(kind){
  if(!actx||muted)return;
  const t0=actx.currentTime;
  const notes=kind==='heart'?[523.25,659.25,783.99]:[987.77,1318.51];
  notes.forEach((f,i)=>{
    const o=actx.createOscillator();o.type='sine';o.frequency.value=f;
    const g=actx.createGain();const st=t0+i*(kind==='heart'?0.09:0.07);
    g.gain.setValueAtTime(0.0001,st);
    g.gain.linearRampToValueAtTime(kind==='heart'?0.05:0.06,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.7);
    o.connect(g);g.connect(master);o.start(st);o.stop(st+0.8);
  });
}

function attachInput(cv){
  const pts=new Map();
  let drag=false,moved=0,downT=0,pinch=0;
  const dist2=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){drag=true;moved=0;downT=performance.now();
      if(world)world.setDragging(true);
      if(state==='live')cv.style.cursor='grabbing';
    }else{drag=false;pinch=dist2();}
  });
  cv.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId);
    if(p){
      const dx=e.clientX-p.x,dy=e.clientY-p.y;
      p.x=e.clientX;p.y=e.clientY;
      if(pts.size===1&&drag){
        moved+=Math.abs(dx)+Math.abs(dy);
        if(state==='live'&&world)world.orbit(dx,dy);
      }else if(pts.size===2){
        const d=dist2();
        if(pinch>0&&state==='live'&&world)world.zoom(pinch/d);
        pinch=d;moved+=20;
      }
    }else if(e.pointerType==='mouse'&&state==='live'&&world){
      const h=world.hover(e.clientX,e.clientY);
      cv.style.cursor=h?'pointer':'grab';
    }
  });
  function up(e){
    if(!pts.has(e.pointerId))return;
    pts.delete(e.pointerId);
    try{cv.releasePointerCapture(e.pointerId);}catch(err){}
    if(pts.size===1){drag=true;moved=999;pinch=0;}
    else if(pts.size===0){
      if(drag){
        drag=false;if(world)world.setDragging(false);
        const dur=performance.now()-downT;
        if(moved<9&&dur<650&&state==='live'&&world)world.tap(e.clientX,e.clientY);
      }
      pinch=0;cv.style.cursor='grab';
    }
  }
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{
    if(!drag&&world&&state==='live'){world.hover(-9999,-9999);cv.style.cursor='grab';}
  });
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    if(state==='live'&&world)world.zoom(Math.exp(e.deltaY*0.0011));
  },{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('gesturestart',e=>e.preventDefault());
  cv.addEventListener('gesturechange',e=>e.preventDefault());
}

      /* agujero negro */
      const bgs=R*0.55;
      ctx.globalAlpha=0.45*gAlpha*(0.85+0.15*Math.sin(t*1.7));
      ctx.drawImage(ST.glow,cx-bgs/2,cy-bgs/2,bgs,bgs);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=gAlpha;
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(cx,cy,R*0.062,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,176,207,.9)';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.ellipse(cx,cy,R*0.096,R*0.096*tilt,0,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,143,184,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(cx,cy,R*0.132,R*0.132*tilt,0,0,Math.PI*2);ctx.stroke();
      /* corazón latiendo */
      ctx.globalCompositeOperation='lighter';
      const b=heartbeat(t);
      const hpop=easeOutBack((rt-0.3)/0.8);
      const s0=Math.max(0.001,U*1.5*(1+0.09*b*(hoverHeart?1.6:1))*hpop);
      const hy=cy-U*2.55;
      heartHX=cx;heartHY=hy;heartHR=s0*1.35;
      const hga=clamp01((rt-0.3)/0.8);
      ctx.globalAlpha=0.3*hga*(0.7+0.9*b);
      const hg=s0*4;
      ctx.drawImage(ST.heart,cx-hg/2,hy-hg/2,hg,hg);
      hpts.forEach((p,i)=>{
        const tw=0.75+0.25*Math.sin(t*2.2+i);
        const s=(p.edge?4.4:3)*zoom*tw;
        ctx.globalAlpha=(p.edge?0.9:0.65)*tw*hga;
        ctx.drawImage(p.edge?ST.white:ST.heart,cx+p.x*s0-s/2,hy-p.y*s0-s/2,s,s);
      });
      /* burbujas de corazón en aros (screen-space, como el video) */
      ctx.globalCompositeOperation='source-over';
      const bubA=smooth((rt-1.8)/0.8);
      bubs.forEach(bb=>{
        bb.y-=bb.vy*dt;if(bb.y<-0.08)bb.y=1.08;
        const bx=bb.x*W+Math.sin(t*bb.sway+bb.ph)*14;
        const by=bb.y*H;
        ctx.globalAlpha=bb.op*bubA;
        ctx.drawImage(BUBBLE_CANVAS[bb.v],bx-bb.sc/2,by-bb.sc/2,bb.sc,bb.sc);
      });
      /* frases */
      const px=Math.min(22,Math.max(13,U*0.85));
      ctx.font='italic 600 '+px+'px '+SERIF;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='rgba(255,120,175,.85)';ctx.shadowBlur=12;
      ctx.fillStyle='#ffdcec';
      phrSlots.forEach((p,i)=>{
        const ang=p.a+theta*0.5-t*0.012;
        const sx=cx+Math.cos(ang)*p.r*U;
        const sy=cy+Math.sin(ang)*p.r*U*tilt-p.y*U+Math.sin(t*p.bobF+i)*8;
        ctx.globalAlpha=smooth((rt-p.delay)/0.7)*(0.55+0.25*Math.sin(t*0.5+i*1.7));
        ctx.fillText(p.text,sx,sy);
      });
      ctx.shadowBlur=0;
      /* stickers */
      slots.forEach((s,i)=>{
        const a=s.phase+t*s.speed;
        const bx=Math.cos(a)*s.r,bz=Math.sin(a)*s.r;
        const X=bx*cth-bz*sth,Z=bx*sth+bz*cth;
        const sx=cx+X*U;
        const sy=cy+Z*U*(tilt+s.incX*0.22)-Math.sin(t*s.bobF+s.phase)*0.35*U-0.3*U;
        const pop=smooth((rt-s.delay)/0.7);
        const back=easeOutBack((rt-s.delay)/0.7);
        s.hoverK+=(((hoverIdx===i)?1:0)-s.hoverK)*Math.min(1,dt*8);
        const size=Math.max(0.001,U*1.6*back*(1+0.18*s.hoverK));
        const img=s.img||(t>s.blinkAt&&t<s.blinkAt+0.16?s.canvasClosed:s.canvasOpen);
        if(!s.img&&t>s.blinkAt+0.16)s.blinkAt=t+rand(2.4,6.5);
        const ar=s.img?clamp(s.img.width/s.img.height,0.5,2):1;
        const sw=size*Math.min(1,ar),sh=size/Math.max(1,ar);
        s.sx=sx;s.sy=sy;s.sw=sw;s.sh=sh;
        /* halo */
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=pop*(0.2+0.32*s.hoverK);
        const hs=size*2.2;
        ctx.drawImage(ST.glow,sx-hs/2,sy-hs/2,hs,hs);
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=pop;
        ctx.save();
        ctx.translate(sx,sy);
        ctx.rotate(Math.sin(t*1.2+s.phase)*0.09);
        ctx.drawImage(img,-sw/2,-sh/2,sw,sh);
        ctx.restore();
      });
      ctx.globalAlpha=1;
    }
  };
}
/* ═══════════════════ arranque ═══════════════════ */
function hasWebGL(){
  try{
    const c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext&&(c.getContext('webgl')||c.getContext('experimental-webgl')));
  }catch(e){return false;}
}
function loadUserStickers(){
  return Promise.all(Array.from({length:12},(_,i)=>new Promise(res=>{
    const img=new Image();
    const to=setTimeout(()=>res(null),3500);
    img.onload=()=>{clearTimeout(to);res(img);};
    img.onerror=()=>{clearTimeout(to);res(null);};
    img.src='sticker'+(i+1)+'.png';
  })));
}
/* reparte tus fotos (sticker1..N) en los 12 lugares de la órbita.
   Si no hay fotos, devuelve null y se dibuja Kitty por código. */
function photoFor(imgs,i){
  const p=imgs.filter(Boolean);
  return p.length?p[i%p.length]:null;
}
function onResize(){
  if(world)world.resize(innerWidth,innerHeight);
}
addEventListener('resize',onResize);
addEventListener('orientationchange',()=>setTimeout(onResize,120));
if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)music.pause();
  else if(entered)music.play().catch(()=>{});
});
/* si se pierde el contexto WebGL en caliente → cambia al mundo 2D */
canvas.addEventListener('webglcontextlost',e=>{
  e.preventDefault();
  if(world&&world.is3D){
    const nc=document.createElement('canvas');nc.id='scene';
    canvas.replaceWith(nc);canvas=nc;attachInput(canvas);
    world=createWorld2D(canvas,USER_IMGS);onResize();
    if(state==='live'||state==='reveal')world.enterGalaxy(T,true);
  }
});
attachInput(canvas);
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;T+=dt;stateT+=dt;
  if(state==='warp'&&stateT>=WARP_DUR){
    flash();world.enterGalaxy(T,false);setState('reveal');
  }else if(state==='reveal'&&stateT>=2.6){
    setState('live');showHint();
  }
  world.update(dt,T,state,stateT);
}
async function boot(){
  const fontsP=(document.fonts&&document.fonts.ready)
    ?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,900))])
    :Promise.resolve();
  const [imgs]=await Promise.all([loadUserStickers(),fontsP]);
  USER_IMGS=imgs;
  let w=null,tried3D=false;
  if(hasWebGL()&&typeof THREE!=='undefined'){
    tried3D=true;
    try{w=createWorld3D(canvas,imgs);}
    catch(err){console.warn('WebGL falló, usando fallback 2D:',err);w=null;}
  }
  if(!w){
    /* el canvas pudo quedar con contexto WebGL: se reemplaza para poder usar 2D */
    if(tried3D){
      const nc=document.createElement('canvas');nc.id='scene';
      canvas.replaceWith(nc);canvas=nc;attachInput(canvas);
    }
    w=createWorld2D(canvas,imgs);
  }
  world=w;onResize();
  if(entered)setState('warp');
  last=performance.now();
  requestAnimationFrame(loop);
}
boot();
})();
